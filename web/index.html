<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏品来源与返还审查</title>
<style>body{font:16px system-ui;max-width:980px;margin:32px auto;padding:0 16px}select,button,input{padding:8px;margin:4px}pre{background:#f4f4f4;padding:12px;white-space:pre-wrap}.panel{border:1px solid #bbb;padding:16px;border-radius:8px;margin-bottom:12px}</style></head>
<body><h1>藏品来源与返还审查</h1>
<div class="panel"><select id="user"><option>staff</option><option>reviewer1</option><option>reviewer2</option><option>claimant1</option><option>public</option></select><button onclick="load()">查看当前角色可见藏品</button><input id="objId" placeholder="藏品ID" size="6"><button onclick="detail()">查看藏品详情</button></div>
<div class="panel"><input id="claimId" placeholder="主张ID" size="6"><select id="decision"><option value="approve">赞成</option><option value="reject">反对</option></select><input id="note" placeholder="审查意见（至少5字）" size="32"><button onclick="vote()">登记审查意见</button><button onclick="review()">查看复核进度</button></div>
<pre id="out"></pre>
<script>
async function load(){const r=await fetch("/api/objects",{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}
async function detail(){const r=await fetch("/api/objects/"+objId.value,{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}
async function vote(){const r=await fetch("/api/claims/"+claimId.value+"/vote",{method:"POST",headers:{"Content-Type":"application/json","X-User-Id":user.value},body:JSON.stringify({decision:decision.value,note:note.value})});out.textContent=JSON.stringify(await r.json(),null,2)}
async function review(){const r=await fetch("/api/claims/"+claimId.value+"/review",{headers:{"X-User-Id":user.value}});out.textContent=JSON.stringify(await r.json(),null,2)}
</script></body></html>
